name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m py_compile companion/host.py

  extension-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Validate manifest JSON
        run: python -m json.tool extension/manifest.json
      - name: Check JavaScript syntax
        run: |
          node --check extension/service-worker.js
          node --check extension/popup.js
      - name: Check shell syntax
        run: bash -n companion/setup.sh companion/uninstall.sh

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Windows unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m py_compile companion/host.py tests/test_host.py
